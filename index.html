<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANTON / SAINT LAURENT</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <header class="top">
      <div class="logo">ANTON / SAINT LAURENT</div>
      <div class="edition">SAINT LAURENT WOMEN'S SUMMER · 2027</div>
    </header>

    <main>

      <div class="counter-space"></div>

      <section class="headline">
        <span>SENTENCES</span>
        <em>FOR</em>
        <span>ANTON LEE.</span>
      </section>

      <section class="quote-section">

        <div class="quote-mark">“</div>

        <div id="quoteDisplay" class="quote">
          Generate a sentences
        </div>

        <div class="quote-mark closing">”</div>

      </section>

      <section class="actions">

        <button id="generateBtn" class="generate" onclick="generateQuote()">
          <strong>GENERATE</strong>
          <small>กดเพื่อสุ่มประโยค</small>
        </button>

        <button id="copyBtn" class="copy" onclick="copyQuote()">
          COPY
        </button>

      </section>

    </main>

    <footer>
      <span>FASHION WEEK </span>
      <span>EN / TH</span>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
